<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Process table of technical focus areas" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace; }
      .cream { fill: #EDE4D3 } .amber { fill: #FFB454 } .dim { fill: #8C7A63 } .cyan { fill: #7FB6B2 }

      .bar { animation: grow 1.15s cubic-bezier(.16,.84,.28,1) backwards; }
      @keyframes grow { from { width: 0 } }
      .b0 { animation-delay: .25s } .b1 { animation-delay: .40s } .b2 { animation-delay: .55s }
      .b3 { animation-delay: .70s } .b4 { animation-delay: .85s } .b5 { animation-delay: 1.0s }

      .row { opacity: 0; animation: fade .2s ease-out forwards }
      @keyframes fade { to { opacity: 1 } }
      .r0 { animation-delay: .20s } .r1 { animation-delay: .35s } .r2 { animation-delay: .50s }
      .r3 { animation-delay: .65s } .r4 { animation-delay: .80s } .r5 { animation-delay: .95s }

      @media (prefers-reduced-motion: reduce) {
        .bar, .row { animation: none; opacity: 1 }
      }
    </style>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C97A2B"/>
      <stop offset="100%" stop-color="#FFB454"/>
    </linearGradient>
    <pattern id="scan2" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFB454" opacity="0.04"/>
    </pattern>
    <clipPath id="box"><rect x="1" y="1" width="898" height="328" rx="12"/></clipPath>
  </defs>

  <rect x="1" y="1" width="898" height="328" rx="12" fill="#12100E" stroke="#2E2721" stroke-width="1.5"/>

  <g clip-path="url(#box)">
    <text class="mono dim" x="40" y="42" font-size="13.5" letter-spacing="1" xml:space="preserve">top - where the hours actually go, trailing 12 months</text>

    <rect x="24" y="58" width="852" height="24" fill="#1E1814"/>
    <g class="mono dim" font-size="12.5" letter-spacing="1">
      <text x="40" y="75">PID</text>
      <text x="100" y="75">DOMAIN</text>
      <text x="470" y="75">LOAD</text>
      <text x="860" y="75" text-anchor="end">%</text>
    </g>

    <g class="mono" font-size="14">
      <!-- row 0 -->
      <g class="row r0">
        <text class="dim" x="40" y="115">1201</text>
        <text class="cream" x="100" y="115">agentic systems</text>
        <text class="dim" x="260" y="115">langgraph · tool calling · rag</text>
        <rect x="470" y="104" width="300" height="12" rx="2" fill="#241D18"/>
        <rect class="bar b0" x="470" y="104" width="276" height="12" rx="2" fill="url(#fill)"/>
        <text class="cyan" x="860" y="115" text-anchor="end">92</text>
      </g>
      <!-- row 1 -->
      <g class="row r1">
        <text class="dim" x="40" y="149">1202</text>
        <text class="cream" x="100" y="149">explainable ai</text>
        <text class="dim" x="260" y="149">shap · attribution · provenance</text>
        <rect x="470" y="138" width="300" height="12" rx="2" fill="#241D18"/>
        <rect class="bar b1" x="470" y="138" width="264" height="12" rx="2" fill="url(#fill)"/>
        <text class="cyan" x="860" y="149" text-anchor="end">88</text>
      </g>
      <!-- row 2 -->
      <g class="row r2">
        <text class="dim" x="40" y="183">1203</text>
        <text class="cream" x="100" y="183">computer vision</text>
        <text class="dim" x="260" y="183">yolo · medical imaging</text>
        <rect x="470" y="172" width="300" height="12" rx="2" fill="#241D18"/>
        <rect class="bar b2" x="470" y="172" width="222" height="12" rx="2" fill="url(#fill)"/>
        <text class="cyan" x="860" y="183" text-anchor="end">74</text>
      </g>
      <!-- row 3 -->
      <g class="row r3">
        <text class="dim" x="40" y="217">1204</text>
        <text class="cream" x="100" y="217">retrieval infra</text>
        <text class="dim" x="260" y="217">qdrant · bm25 · rerankers</text>
        <rect x="470" y="206" width="300" height="12" rx="2" fill="#241D18"/>
        <rect class="bar b3" x="470" y="206" width="213" height="12" rx="2" fill="url(#fill)"/>
        <text class="cyan" x="860" y="217" text-anchor="end">71</text>
      </g>
      <!-- row 4 -->
      <g class="row r4">
        <text class="dim" x="40" y="251">1205</text>
        <text class="cream" x="100" y="251">backend</text>
        <text class="dim" x="260" y="251">fastapi · postgres · redis · docker</text>
        <rect x="470" y="240" width="300" height="12" rx="2" fill="#241D18"/>
        <rect class="bar b4" x="470" y="240" width="201" height="12" rx="2" fill="url(#fill)"/>
        <text class="cyan" x="860" y="251" text-anchor="end">67</text>
      </g>
      <!-- row 5 -->
      <g class="row r5">
        <text class="dim" x="40" y="285">1206</text>
        <text class="cream" x="100" y="285">edge llms</text>
        <text class="dim" x="260" y="285">ollama · gemma · quantization</text>
        <rect x="470" y="274" width="300" height="12" rx="2" fill="#241D18"/>
        <rect class="bar b5" x="470" y="274" width="174" height="12" rx="2" fill="url(#fill)"/>
        <text class="cyan" x="860" y="285" text-anchor="end">58</text>
      </g>
    </g>

    <rect x="0" y="0" width="900" height="330" fill="url(#scan2)"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Terminal boot sequence for Manipal Sabhavat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace; }
      .cream { fill: #EDE4D3; }
      .amber { fill: #FFB454; }
      .dim   { fill: #8C7A63; }
      .cyan  { fill: #7FB6B2; }
      .rose  { fill: #E08A5B; }

      .l { opacity: 0; animation: fade .22s ease-out forwards; }
      .d0 { animation-delay: .15s } .d1 { animation-delay: .70s }
      .d2 { animation-delay: 1.05s } .d3 { animation-delay: 1.40s }
      .d4 { animation-delay: 1.75s } .d5 { animation-delay: 2.10s }
      .d6 { animation-delay: 3.75s } .d7 { animation-delay: 4.05s }
      @keyframes fade { to { opacity: 1 } }

      #nameclip rect { animation: type .95s steps(17) 2.65s backwards; }
      @keyframes type { from { width: 0 } }

      .cur { opacity: 0; animation: fade .1s 4.15s forwards, blink 1.05s step-end 4.25s infinite; }
      @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }

      .rec { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }

      @media (prefers-reduced-motion: reduce) {
        .l, .cur, .rec { animation: none; opacity: 1 }
        #nameclip rect { animation: none }
      }
    </style>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFB454" opacity="0.045"/>
    </pattern>

    <filter id="glow" x="-30%" y="-60%" width="160%" height="240%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="1 0 0 0 0  0 .62 0 0 0  0 0 .18 0 0  0 0 0 .55 0" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="vig" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".42"/>
    </radialGradient>

    <clipPath id="nameclip">
      <rect x="40" y="230" width="620" height="60"/>
    </clipPath>

    <clipPath id="screen">
      <rect x="1" y="1" width="898" height="398" rx="12"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="898" height="398" rx="12" fill="#12100E" stroke="#2E2721" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="1" y="1" width="898" height="36" rx="12" fill="#1A1512"/>
  <rect x="1" y="25" width="898" height="12" fill="#1A1512"/>
  <line x1="1" y1="37" x2="899" y2="37" stroke="#2E2721" stroke-width="1.5"/>
  <circle class="rec" cx="26" cy="19" r="4.5" fill="#FFB454"/>
  <text class="mono dim" x="44" y="24" font-size="12.5" letter-spacing="1.2">agent-runtime · tty0</text>
  <text class="mono dim" x="860" y="24" font-size="12.5" text-anchor="end">80x24</text>

  <g clip-path="url(#screen)">
    <!-- boot log -->
    <g class="mono" font-size="15">
      <text class="l d0" x="40" y="76"><tspan class="amber">$</tspan><tspan class="cream" xml:space="preserve"> ./init --profile manipal</tspan></text>

      <text class="l d1" x="40" y="110" xml:space="preserve"><tspan class="dim">[</tspan><tspan class="cyan"> ok </tspan><tspan class="dim">]  </tspan><tspan class="dim">mount   </tspan><tspan class="cream">research/explainable-ai</tspan><tspan class="dim">.............</tspan><tspan class="amber"> ready</tspan></text>

      <text class="l d2" x="40" y="136" xml:space="preserve"><tspan class="dim">[</tspan><tspan class="cyan"> ok </tspan><tspan class="dim">]  </tspan><tspan class="dim">spawn   </tspan><tspan class="cream">agents/contextops</tspan><tspan class="dim">...................</tspan><tspan class="amber"> running</tspan></text>

      <text class="l d3" x="40" y="162" xml:space="preserve"><tspan class="dim">[</tspan><tspan class="cyan"> ok </tspan><tspan class="dim">]  </tspan><tspan class="dim">spawn   </tspan><tspan class="cream">agents/phytolens-ai</tspan><tspan class="dim">.................</tspan><tspan class="amber"> running</tspan></text>

      <text class="l d4" x="40" y="188" xml:space="preserve"><tspan class="dim">[</tspan><tspan class="rose"> wip</tspan><tspan class="dim">]  </tspan><tspan class="dim">build   </tspan><tspan class="cream">security/tripwire</tspan><tspan class="dim">...................</tspan><tspan class="rose"> in public</tspan></text>

      <text class="l d5" x="40" y="214" xml:space="preserve"><tspan class="dim">[</tspan><tspan class="cyan"> ok </tspan><tspan class="dim">]  </tspan><tspan class="dim">index   </tspan><tspan class="cream">papers/pcems-2025</tspan><tspan class="dim">...................</tspan><tspan class="amber"> springer ccis</tspan></text>
    </g>

    <!-- name, typed -->
    <g clip-path="url(#nameclip)">
      <text class="mono amber" x="40" y="278" font-size="42" font-weight="600" letter-spacing="1.5" filter="url(#glow)">MANIPAL SABHAVAT</text>
    </g>

    <text class="mono l d6" x="42" y="306" font-size="14.5" letter-spacing=".6" xml:space="preserve"><tspan class="dim">ece + ai/ml · sr university, warangal · b.tech '27</tspan></text>

    <text class="mono l d7" x="40" y="352" font-size="15" xml:space="preserve"><tspan class="amber">$</tspan><tspan class="cream"> i build agentic systems that can explain themselves</tspan></text>
    <rect class="cur" x="40" y="366" width="10" height="3" fill="#FFB454"/>

    <rect x="0" y="38" width="900" height="362" fill="url(#scan)"/>
    <rect x="0" y="0" width="900" height="400" fill="url(#vig)"/>
  </g>
</svg>

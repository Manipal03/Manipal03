name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: Manipal03
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%23FFB454&color_dots=%23241D18,%23C97A2B,%23E08A5B,%23FFB454,%23FFD9A0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
